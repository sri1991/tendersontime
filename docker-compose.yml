services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: to_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tenderscout
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    ports:
      - "127.0.0.1:5432:5432"   # bind to localhost only — not exposed to internet
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tenderscout"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: to_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # localhost only
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: .
    container_name: to_api
    restart: unless-stopped
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "127.0.0.1:8000:8000"   # nginx proxies to this — not exposed directly
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://tender:tender@postgres:5432/tenderscout
      - REDIS_URL=redis://redis:6379/0
      - SEARCH_BACKEND=${SEARCH_BACKEND:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest_worker:
    build: .
    container_name: to_worker
    restart: unless-stopped
    command: python -c "import time; print('Worker ready'); time.sleep(86400)"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 1500M    # ingestion is memory-heavy during embedding batches
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://tender:tender@postgres:5432/tenderscout
      - REDIS_URL=redis://redis:6379/0
      - SEARCH_BACKEND=${SEARCH_BACKEND:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
